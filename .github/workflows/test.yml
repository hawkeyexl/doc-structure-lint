name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # Skip husky hook installation (`prepare`); CI runs the checks directly.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: "0"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The suite runs against `src/`, where the built-in templates sit one
      # directory deeper than they do in the bundled `dist/`. A path that is
      # right in the repo and wrong in the package passes every test above, so
      # the built CLI gets exercised the way a user would run it.
      - name: Smoke-test the built package
        run: npm run smoke
